<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Refactoring Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        #sidebar-header h1 {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .help-button {
            background: transparent;
            border: none;
            color: #007bff;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        .help-button:hover {
            color: #0056b3;
        }

        #new-dialogue-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-with-clear {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-clear input {
            flex: 1;
            padding-right: 30px;
        }

        .clear-input-button {
            position: absolute;
            right: 8px;
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: none;
        }

        .input-with-clear input:not(:placeholder-shown) ~ .clear-input-button {
            display: block;
        }

        .clear-input-button:hover {
            color: #dc3545;
        }

        #new-dialogue-form input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #new-dialogue-form button {
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #new-dialogue-form button:hover {
            background: #0056b3;
        }

        #new-dialogue-form .button-row {
            display: flex;
            gap: 10px;
        }

        #create-dialogue-button {
            flex: 1;
        }

        #open-config-button {
            padding: 8px 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #open-config-button:hover {
            background: #5a6268;
        }

        #dialogue-list {
            flex: 1;
            overflow-y: auto;
        }

        .dialogue-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dialogue-item:hover {
            background: #f8f9fa;
        }

        .dialogue-item.active {
            background: #e7f3ff;
            border-left: 3px solid #007bff;
        }

        .dialogue-info {
            flex: 1;
            min-width: 0;
        }

        .dialogue-delete {
            padding: 4px 8px;
            background: transparent;
            color: #dc3545;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            margin-left: 8px;
        }

        .dialogue-item:hover .dialogue-delete {
            opacity: 1;
        }

        .dialogue-delete:hover {
            background: #dc3545;
            color: white;
        }

        .dialogue-path {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            word-break: break-all;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #dialogue-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        #message-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            background: white;
            border-radius: 8px;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .message.user {
            background: #e7f3ff;
            margin-left: 20%;
        }

        .message.assistant {
            background: #f8f9fa;
            margin-right: 20%;
        }

        .message-role {
            font-weight: bold;
            margin-bottom: 8px;
            color: #007bff;
        }

        .message.assistant .message-role {
            color: #28a745;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #message-input-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }

        #prompt-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }

        #send-button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-button:hover {
            background: #0056b3;
        }

        #send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #checkpoint-panel {
            width: 300px;
            background: white;
            border-left: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
        }

        #checkpoint-panel h2 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .checkpoint-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .checkpoint-description {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .checkpoint-date {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .checkpoint-rollback {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .checkpoint-rollback:hover {
            background: #c82333;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Model Configuration Modal Styles */
        #model-config-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #model-config-overlay.active {
            display: flex;
        }

        #model-config-modal {
            background: white;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #modal-header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #modal-header h2 {
            font-size: 20px;
            margin: 0;
        }

        #close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #close-modal:hover {
            color: #000;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-button:hover {
            background: #f8f9fa;
        }

        .tab-button.active {
            color: #007bff;
            border-bottom-color: #007bff;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            padding: 12px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        #status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }

        #status-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #status-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .field-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }

        .form-group input.invalid,
        .form-group select.invalid {
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div id="sidebar-header">
                <h1>
                    Диалоги
                    <button class="help-button" onclick="showHelp()" title="Помощь">❓</button>
                </h1>
                <div id="new-dialogue-form">
                    <div class="input-with-clear">
                        <input type="text" id="project-path-input" placeholder="Путь к проекту C#">
                        <button class="clear-input-button" onclick="clearProjectPath()" title="Очистить">✕</button>
                    </div>
                    <div class="button-row">
                        <button id="create-dialogue-button">Создать диалог</button>
                        <button id="open-config-button">⚙️</button>
                    </div>
                </div>
            </div>
            <div id="dialogue-list"></div>
        </div>

        <div id="main-content">
            <div id="dialogue-view">
                <div id="message-list"></div>
                <div id="message-input-container">
                    <input type="text" id="prompt-input" placeholder="Введите команду для вашего проекта (например: Покажи файл Program.cs)...">
                    <button id="send-button">Отправить</button>
                </div>
            </div>
        </div>

        <div id="checkpoint-panel">
            <h2>Чекпоинты</h2>
            <div id="checkpoint-list"></div>
        </div>
    </div>

    <!-- Model Configuration Modal -->
    <div id="model-config-overlay">
        <div id="model-config-modal">
            <div id="modal-header">
                <h2>Model Configuration</h2>
                <button id="close-modal" aria-label="Close">&times;</button>
            </div>

            <div class="tabs">
                <button class="tab-button active" data-tab="provider">Provider</button>
                <button class="tab-button" data-tab="local">Local</button>
            </div>

            <div id="provider-tab" class="tab-content active">
                <div class="form-group">
                    <label for="provider-base-url">Base URL</label>
                    <input 
                        type="text" 
                        id="provider-base-url" 
                        placeholder="https://api.deepseek.com/v1"
                        aria-label="Provider base URL">
                </div>

                <div class="form-group">
                    <label for="provider-api-key">API Key</label>
                    <input 
                        type="password" 
                        id="provider-api-key" 
                        placeholder="Enter your API key"
                        aria-label="Provider API key">
                </div>

                <div class="form-group">
                    <label for="provider-model">Model Name</label>
                    <input 
                        type="text" 
                        id="provider-model" 
                        placeholder="deepseek-chat"
                        aria-label="Provider model name">
                </div>

                <div class="form-actions">
                    <button id="save-provider" class="btn-primary">Save Provider Configuration</button>
                    <button id="test-provider" class="btn-secondary">Test Connection</button>
                </div>
            </div>

            <div id="local-tab" class="tab-content">
                <div class="form-group">
                    <label for="ollama-base-url">Ollama URL</label>
                    <input 
                        type="text" 
                        id="ollama-base-url" 
                        placeholder="http://localhost:11434"
                        aria-label="Ollama base URL">
                </div>

                <div class="form-group">
                    <label for="ollama-model">Model</label>
                    <select id="ollama-model" aria-label="Ollama model selection">
                        <option value="">Select a model</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button id="refresh-models" class="btn-secondary">Refresh Models</button>
                </div>

                <div class="form-actions">
                    <button id="save-local" class="btn-primary">Save Local Configuration</button>
                    <button id="test-local" class="btn-secondary">Test Connection</button>
                </div>
            </div>

            <div id="status-message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
