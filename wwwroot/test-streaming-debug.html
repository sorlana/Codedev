<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отладка Streaming</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
        }
        .log-entry {
            margin: 3px 0;
            padding: 3px;
        }
        .log-entry.info { color: #0066cc; }
        .log-entry.success { color: #00aa00; }
        .log-entry.error { color: #cc0000; }
        .log-entry.warn { color: #ff8800; }
        #message-display {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        input[type="text"], input[type="number"] {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.connected { background: #d4edda; color: #155724; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        .status.streaming { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🔍 Отладка WebSocket Streaming</h1>
    
    <div class="container">
        <div class="panel">
            <h3>Управление</h3>
            <div>
                <label>Dialogue ID: <input type="number" id="dialogueId" value="1"></label>
            </div>
            <div>
                <button onclick="connect()">Подключиться</button>
                <button onclick="disconnect()">Отключиться</button>
            </div>
            <div id="status" class="status disconnected">
                Статус: Отключено
            </div>
            <div>
                <label>Сообщение: <input type="text" id="messageInput" value="Привет!" style="width: 300px;"></label>
                <button onclick="sendMessage()" id="sendBtn" disabled>Отправить</button>
            </div>
            
            <h3>Статистика</h3>
            <div id="stats" style="font-family: monospace; font-size: 12px;">
                <div>Фрагментов получено: <span id="chunkCount">0</span></div>
                <div>Символов получено: <span id="charCount">0</span></div>
                <div>Время первого фрагмента: <span id="ttfb">-</span></div>
                <div>Общее время: <span id="totalTime">-</span></div>
            </div>
        </div>
        
        <div class="panel">
            <h3>Полученное сообщение</h3>
            <div id="message-display"></div>
        </div>
    </div>
    
    <div class="panel" style="margin-top: 20px;">
        <h3>Лог событий</h3>
        <button onclick="clearLog()">Очистить лог</button>
        <div id="log" class="log"></div>
    </div>
    
    <script>
        let ws = null;
        let messageContent = '';
        let chunkCount = 0;
        let charCount = 0;
        let startTime = null;
        let firstChunkTime = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function updateStatus(status, text) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${status}`;
            statusDiv.textContent = `Статус: ${text}`;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = status !== 'connected';
        }
        
        function updateStats() {
            document.getElementById('chunkCount').textContent = chunkCount;
            document.getElementById('charCount').textContent = charCount;
            
            if (firstChunkTime && startTime) {
                const ttfb = firstChunkTime - startTime;
                document.getElementById('ttfb').textContent = `${ttfb.toFixed(0)}ms`;
            }
            
            if (startTime) {
                const total = performance.now() - startTime;
                document.getElementById('totalTime').textContent = `${total.toFixed(0)}ms`;
            }
        }
        
        function connect() {
            const dialogueId = document.getElementById('dialogueId').value;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('WebSocket уже подключен', 'warn');
                return;
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const wsUrl = `${protocol}//${host}/ws?dialogueId=${dialogueId}`;
            
            log(`Подключение к ${wsUrl}...`, 'info');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = (event) => {
                log('✅ WebSocket подключен!', 'success');
                updateStatus('connected', 'Подключено');
            };
            
            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    const type = message.type || message.Type;
                    const payload = message.payload || message.Payload;
                    
                    log(`📨 Получено: ${type}`, 'info');
                    
                    switch (type) {
                        case 'connection_ack':
                            log(`✅ ConnectionId: ${payload.connectionId || payload.ConnectionId}`, 'success');
                            break;
                            
                        case 'assistant_message_start':
                            log('🚀 Начало генерации ответа', 'success');
                            updateStatus('streaming', 'Генерация...');
                            messageContent = '';
                            chunkCount = 0;
                            charCount = 0;
                            startTime = performance.now();
                            firstChunkTime = null;
                            document.getElementById('message-display').textContent = '';
                            updateStats();
                            break;
                            
                        case 'assistant_message_chunk':
                            const content = payload.content || payload.Content || '';
                            if (!firstChunkTime) {
                                firstChunkTime = performance.now();
                            }
                            chunkCount++;
                            charCount += content.length;
                            messageContent += content;
                            document.getElementById('message-display').textContent = messageContent;
                            log(`📝 Фрагмент #${chunkCount}: ${content.length} символов`, 'success');
                            updateStats();
                            break;
                            
                        case 'assistant_message_end':
                            log('✅ Генерация завершена', 'success');
                            updateStatus('connected', 'Подключено');
                            const finalContent = payload.content || payload.Content;
                            if (finalContent) {
                                document.getElementById('message-display').textContent = finalContent;
                                log(`📊 Итого: ${finalContent.length} символов`, 'info');
                            }
                            updateStats();
                            break;
                            
                        case 'error':
                            const errorMsg = payload.message || payload.Message || 'Неизвестная ошибка';
                            log(`❌ Ошибка: ${errorMsg}`, 'error');
                            updateStatus('connected', 'Подключено (ошибка)');
                            break;
                            
                        default:
                            log(`⚠️ Неизвестный тип: ${type}`, 'warn');
                    }
                } catch (error) {
                    log(`❌ Ошибка парсинга: ${error.message}`, 'error');
                }
            };
            
            ws.onerror = (error) => {
                log('❌ Ошибка WebSocket', 'error');
                console.error(error);
            };
            
            ws.onclose = (event) => {
                log(`🔌 WebSocket закрыт: код ${event.code}, причина: ${event.reason || 'нет'}`, 'warn');
                updateStatus('disconnected', 'Отключено');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                log('🔌 Отключение...', 'info');
            }
        }
        
        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket не подключен!', 'error');
                return;
            }
            
            const content = document.getElementById('messageInput').value;
            const dialogueId = parseInt(document.getElementById('dialogueId').value);
            
            const message = {
                type: 'user_message',
                payload: {
                    dialogueId: dialogueId,
                    content: content
                },
                timestamp: new Date().toISOString()
            };
            
            log(`📤 Отправка: "${content}"`, 'info');
            ws.send(JSON.stringify(message));
        }
        
        // Автоподключение при загрузке
        window.addEventListener('load', () => {
            log('✅ Страница загружена', 'success');
        });
    </script>
</body>
</html>
